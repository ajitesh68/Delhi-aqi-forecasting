# Mirror the repository to a Hugging Face Space.
#
# GitHub stays the source of truth: the hourly collector commits here, and
# every push -- including those data commits -- is mirrored to the Space,
# so the deployed app picks up new station-hours without a second pipeline.
#
# Needs one secret, HF_TOKEN, a write token from
# https://huggingface.co/settings/tokens. Set HF_SPACE below to your own
# Space, e.g. "ajitesh68/delhi-air".

name: Sync to Hugging Face

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: sync-to-hf
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      HF_SPACE: ajitesh68/delhi-air
    steps:
      - uses: actions/checkout@v4
        with:
          # The Space wants the full history; a shallow clone cannot be
          # pushed without forcing.
          fetch-depth: 0
          lfs: true

      - name: Push to the Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "HF_TOKEN is not set -- add it in Settings > Secrets before enabling this."
            exit 1
          fi
          git push --force \
            "https://user:$HF_TOKEN@huggingface.co/spaces/$HF_SPACE" \
            main:main
